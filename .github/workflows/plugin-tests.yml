name: Plugin & Framework Tests

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Plugin Contract Tests
        run: bash tests/contract/plugins/test_plugin_lifecycle.sh

      - name: Run Swarm Contract Tests
        run: bash tests/contract/plugins/test_swarm_lifecycle.sh

      - name: Run Constitution Tests
        run: bash tests/contract/test_constitution.sh

      - name: Run Deprecation Tests
        run: bash tests/contract/test_deprecation.sh

      - name: Run Plugin Command Bridge Tests
        run: bash tests/contract/test_plugin_command_bridge.sh

      - name: Run Product Workspace Boundary Tests
        run: bash tests/contract/test_product_workspace_boundary.sh

      - name: Run Model Agnosticism Tests
        run: bash tests/contract/test_model_agnostic.sh

      - name: Run Graph Bridge Tests
        run: bash tests/contract/test_graph_bridge.sh

      - name: Run Governance Hooks Tests
        run: bash tests/contract/test_governance_hooks.sh

      - name: Run Policy Matching Tests
        run: bash tests/contract/test_policy_matching.sh

      - name: Run Orchestration Hook Tests
        run: bash tests/contract/test_orchestration_hook.sh

      - name: Run Memory Search Tests
        run: bash tests/contract/test_memory_search.sh

      - name: Run Spec 006 Integration Tests
        run: bash tests/contract/test_spec006_integration.sh

      - name: Run Governance Verdicts Tests
        run: bash tests/contract/test_governance_verdicts.sh

      - name: Run Freeze Scope Tests
        run: bash tests/contract/test_freeze_scope.sh

      - name: Run Git Adapter Tests
        run: bash tests/contract/test_git_adapter.sh

      - name: Run Disposition Tandem Tests
        run: bash tests/contract/test_disposition_tandem.sh

      - name: Run Suite Registration Tests
        run: bash tests/contract/test_suite_registration.sh

      - name: Run Generated Artifacts Declared Tests
        run: bash tests/contract/test_generated_artifacts_declared.sh

      - name: Run Scrub Rules Match Tests
        run: bash tests/contract/test_scrub_rules_match.sh

      - name: Run gh Telemetry Notice Tests
        run: bash tests/contract/test_gh_telemetry_notice.sh

      - name: Run Environment Declaration Tests
        run: bash tests/contract/test_environment_declaration.sh

      - name: Run Git Safety Tests
        run: bash .logic-loom/tests/test-git-safety.sh

      - name: Run Policy Validation Tests
        run: bash .logic-loom/tests/test-policy-validation.sh

      - name: Run Structured Logging Tests
        run: bash .logic-loom/tests/test_logging.sh

      - name: Validate All Manifests
        run: |
          python3 -c "
          import json, os, sys
          errors = []
          for name in sorted(os.listdir('plugins')):
              manifest = os.path.join('plugins', name, '.claude-plugin', 'plugin.json')
              if not os.path.exists(manifest):
                  continue
              try:
                  with open(manifest) as f:
                      d = json.load(f)
                  for field in ['name', 'version', 'dependencies']:
                      if field not in d:
                          errors.append(f'{name}: missing {field}')
              except json.JSONDecodeError as e:
                  errors.append(f'{name}: invalid JSON - {e}')
          if errors:
              for e in errors:
                  print(f'❌ {e}')
              sys.exit(1)
          else:
              print(f'✅ All plugin manifests valid')
          "

      - name: Constitutional Compliance Check
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .logic-loom/scripts/bash/constitutional-check.sh ]; then
            bash .logic-loom/scripts/bash/constitutional-check.sh || true
          fi
