# LogicLoom environment declaration
#
# WHAT THIS IS: a DECLARATION of your project's deployment environments and the
# order in which changes promote through them. It is a statement of intent that
# a human and an agent can both read, and that `validate-environments.sh` can
# check for coherence.
#
# WHAT THIS IS NOT: a deployment pipeline. The harness ships NO deploy execution.
# It does not know your cloud, your CI provider, your secrets store, your
# migration runner, or your rollback mechanics — and it will not guess. Those
# live behind the `deploy` seam below, in a script YOUR project owns.
#
# NOTHING HERE IS ENFORCED. No hook reads this file. `requires_approval` is a
# declaration your CI (or your reviewer) is expected to honour — the harness will
# not notice if you deviate. The one thing the harness does provide is the
# reader/validator, which is read-only and never deploys, and never runs git.
#
#   ./.logic-loom/scripts/bash/validate-environments.sh
#
# Override precedence: env LOOM_ENVIRONMENTS_CONF > this file > nothing declared.
# "Nothing declared" is a NORMAL state — a project with no environments is
# valid, and the validator exits 0 on an absent or empty file.
#
# ─────────────────────────────────────────────────────────────────────────────
# GRAMMAR
# ─────────────────────────────────────────────────────────────────────────────
# `key = value`, one per line, `#` starts a comment — the same grammar as the
# sibling configs (governance.conf, models.conf). Whitespace around `=` is
# ignored. This file is NEVER sourced or evaluated; it is parsed as text.
#
# `environment = <name>` OPENS a block. Every key after it belongs to that block
# until the next `environment =` line. A key appearing before any `environment =`
# is an error (it belongs to nothing).
#
#   environment       = <name>     REQUIRED. Block opener. The environment's
#                                  name. Must be unique. [A-Za-z0-9_-]+
#
#   branch            = <ref>      The branch this environment tracks. Free text
#                                  — the harness does not create, check out, or
#                                  verify the branch, and creates no branches.
#                                  Omit it if the environment is advanced by a
#                                  tag or a manual dispatch rather than a branch.
#
#   requires_approval = true|false Whether promotion INTO this environment needs
#                                  a human approval. Defaults to `false` when
#                                  omitted. Declarative: wire it to a real gate
#                                  (e.g. a GitHub Environment with required
#                                  reviewers) yourself.
#
#   promotes_from     = <name>     The environment immediately BEFORE this one in
#                                  the promotion order. Omit it for the first
#                                  environment in a chain. Must name a declared
#                                  environment, and the order must be acyclic.
#
#   deploy            = <path>     THE SEAM. A PRODUCT-owned script that performs
#                                  the deployment. The harness will never provide
#                                  this, never invoke it, and never inspect it.
#                                  It exists so the declaration can point at the
#                                  thing that does the work without the harness
#                                  having an opinion about what that thing is.
#
#   rehearsal_seed_allowlist = <path>
#                                  A SECOND SEAM, same posture as `deploy`. Names
#                                  the PRODUCT-owned file listing the accounts (or
#                                  tenants, or rows) a rehearsal/staging seed is
#                                  permitted to copy from production. The harness
#                                  NEVER reads this file, never parses it, never
#                                  seeds anything, and has no opinion about its
#                                  format. It only records where it lives.
#
#                                  The declaration exists to name a FAIL-CLOSED
#                                  input: your seed must ABORT on an empty or
#                                  missing allowlist, never degrade to "copy
#                                  everything". Degrading is how production
#                                  personal data lands in a lesser environment
#                                  silently. Enforcing that is YOUR seed script's
#                                  job — see
#                                  .docs/policies/environment-promotion-policy.md
#                                  § 4.4.
#
#   confirm           = none|prompt|typed:<PHRASE>
#                                  Confirmation strength for promoting INTO this
#                                  environment — the escalating-confirm pattern
#                                  (same policy, § 4.3). Defaults to `none`.
#
#                                    none            no interactive confirmation
#                                    prompt          a yes/no prompt; an
#                                                    automation flag may skip it
#                                    typed:<PHRASE>  the operator must type
#                                                    <PHRASE> exactly. NO flag may
#                                                    bypass it. Reserve for
#                                                    production-scale blast radius.
#
#                                  COHERENCE RULE (checked by the validator):
#                                  `confirm = typed:<PHRASE>` requires
#                                  `requires_approval = true` in the same block.
#                                  "Demand a typed phrase" and "no approval
#                                  needed" cannot both be true.
#
#                                  The reverse pairing is FINE and common:
#                                  `requires_approval = true` with
#                                  `confirm = none` is an environment whose gate
#                                  is a CI approval (a reviewer on a protected
#                                  environment), not a terminal prompt.
#
#                                  Declarative like everything else here: the
#                                  harness prompts for nothing and confirms
#                                  nothing. Your promotion script implements it.
#
# Unknown keys are WARNED about and ignored — never fatal. (The sibling configs
# skip lines they do not recognise; this file does the same, but says so out
# loud, because a typo'd key here silently does nothing and that is worth
# hearing about.) Structural problems — a duplicate name, a predecessor that is
# not declared, a cycle, an invalid `requires_approval` — are ERRORS.
#
# ─────────────────────────────────────────────────────────────────────────────
# SHIPPED WITH NOTHING DECLARED — ON PURPOSE
# ─────────────────────────────────────────────────────────────────────────────
# The three-environment example below is COMMENTED OUT. It is a worked example,
# not a default.
#
# Why not ship it active: an active declaration would assert branches and a
# topology your project does not have. That is exactly the defect that made the
# shipped deployment policy describe a repo that did not exist. Principle V
# (Progressive Enhancement) says the same thing from the other direction — do
# not ship a three-environment pipeline before one environment is proven in use.
#
# Uncomment what you actually run. One environment is a perfectly good answer.
#
# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE — a conventional dev -> staging -> prod chain (COMMENTED OUT)
# ─────────────────────────────────────────────────────────────────────────────
#
# environment       = dev
# branch            = main
# requires_approval = false
# confirm           = none
# deploy            = web/scripts/deploy-dev.sh
#
# environment       = staging
# branch            = release
# promotes_from     = dev
# requires_approval = false
# confirm           = prompt
# rehearsal_seed_allowlist = web/config/rehearsal-allowlist.txt
# deploy            = web/scripts/deploy-staging.sh
#
# environment       = prod
# branch            = release
# promotes_from     = staging
# requires_approval = true
# confirm           = typed:PROMOTE TO PRODUCTION
# deploy            = web/scripts/deploy-prod.sh
#
# ─────────────────────────────────────────────────────────────────────────────
# YOUR DECLARATIONS BELOW THIS LINE
# ─────────────────────────────────────────────────────────────────────────────
