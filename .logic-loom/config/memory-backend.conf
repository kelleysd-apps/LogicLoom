# LogicLoom memory backend — WHERE durable cross-session memory is written
#
# This file is LIVE. It answers one question and nothing else: when a command
# writes a durable lesson (today: /retro), which store does it go to?
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS
# ─────────────────────────────────────────────────────────────────────────────
# The path used to be hardcoded, in prose, inside the /retro skill:
#
#     $HOME/.claude/projects/<slug>/memory/
#
# A fine default and a bad contract: nothing could point it anywhere else
# without editing the skill, and the store it fed was per-machine and invisible
# to anything that is not Claude Code. So the destination became a setting.
# One resolver, one answer, one place to change it.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE TWO BACKENDS — AND THE ONE THAT WAS DELETED
# ─────────────────────────────────────────────────────────────────────────────
#   repo      .brain/memory/ — IN-TREE and VERSIONED. THE SHIPPED DEFAULT.
#             Lessons travel with the code, survive a machine change, are
#             reviewable in a diff, and are readable by any tool with
#             filesystem access — not just Claude Code. Stripped at template
#             release (see template-strip-manifest.txt), so your lessons never
#             ship to a cloner.
#
#   project   $HOME/.claude/projects/<slug>/memory/
#             <slug> is this repo's absolute path with every `/` replaced by
#             `-` (the convention Claude Code itself uses). Per-machine,
#             outside the repo, never committed, never shipped — and invisible
#             to anything that is not Claude Code. This is where /retro wrote
#             historically. Choose it when memory is personal rather than a
#             team artifact, or when you do not want retro lessons in a diff.
#
# A THIRD BACKEND WAS DELETED, and it is named here so nobody proposes it
# again: an absolute path, configured per machine, pointing at whatever
# external knowledge store the operator happened to keep. It inverted the
# relationship. `.brain/` IS this project's vault — self-contained, scoped to
# this project — and an external store reads IT. The project never reaches out
# to somebody else's directory. A config key naming a path that exists on
# exactly one machine is one person's setup shipped as a product feature.
# It is deleted, not commented out: a dead config key is a claim about a
# capability that does not exist.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE DEFAULT CHANGED, AND HERE IS WHAT HAPPENS TO AN EXISTING PROJECT
# ─────────────────────────────────────────────────────────────────────────────
# The default used to be `project`. It is now `repo`, because a retrospective's
# lessons are project knowledge and belong with the project.
#
# If this repo already has memory under $HOME/.claude/projects/<slug>/memory/,
# NOTHING IS MOVED AND NOTHING IS DELETED. You get told. When memory resolves
# to `repo` while that directory still holds files,
# `.logic-loom/scripts/bash/check-brain-signals.sh` reports the file count and
# both paths in the preflight advisory, every session, until you either move
# the files into .brain/memory/ or set `memory_backend = project` below. The
# harness will not move them for you, and the advisory never blocks anything.
#
# WHAT WAS DELIBERATELY NOT BUILT, so nobody re-proposes it: a default that
# PROBES for that directory and quietly holds there. It was designed and
# rejected. The <slug> is derived from the checkout path, so a probe resolves
# `project` in the main checkout and `repo` in a worktree of the SAME project —
# two stores, neither aware of the other, which is exactly the defect this file
# exists to prevent, and the swarm pack is worktree-based. It also fails
# silently in the one case that matters most (a moved or renamed repo changes
# the slug, so the probe finds nothing and orphans the store without a word),
# and it turns a reviewable one-line config diff into a filesystem side effect
# with no diff anywhere. Resolution is a pure function of (env, conf).
# Migration is DETECTION, by an advisory a human reads. Not resolution.
#
# ─────────────────────────────────────────────────────────────────────────────
# SYNTAX
# ─────────────────────────────────────────────────────────────────────────────
# Same `key = value` grammar as the sibling config files. `#` starts a comment.
# First occurrence of a key wins. There is no wildcard and no list form: one
# repo has one memory backend, because the whole point is that it has one.
#
# Override precedence, highest first:
#   env LOOM_MEMORY_BACKEND  >  this file  >  built-in default (`repo`)
#
# ─────────────────────────────────────────────────────────────────────────────
# FAILURE POSTURE — FAIL-SAFE, NOT FAIL-CLOSED
# ─────────────────────────────────────────────────────────────────────────────
# An unrecognised `memory_backend` does NOT abort the write. The resolver warns
# on stderr and falls back to `repo`. Reason: losing a retrospective's lessons
# because a config line has a typo is a worse outcome than writing them to the
# default store and saying so out loud.
#
# The resolver NEVER runs git, NEVER writes outside the resolved directory, and
# NEVER creates a directory unless asked (`--ensure`).
#
#   Read it:   bash .logic-loom/scripts/bash/resolve-memory-backend.sh --explain
#
# ─────────────────────────────────────────────────────────────────────────────
# PROTECTION
# ─────────────────────────────────────────────────────────────────────────────
# This file governs behaviour, so it is on the governance guard's protected-path
# list alongside gate-policy.conf, declared additively via `protected_paths` in
# .logic-loom/config/governance.conf:
#
#     protected_paths = .logic-loom/config/memory-backend.conf
#     protected_paths = .logic-loom/config/brain.conf
#
# Those lines are IN PLACE. A subagent is DENIED writes here; a main-agent edit
# prompts for approval. Editing this file will prompt, and that is correct.

memory_backend = repo
