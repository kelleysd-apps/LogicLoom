# LogicLoom project identity declaration
#
# WHAT THIS IS: the stable, machine-readable answer to "which project is this?".
# One record, three required keys. It exists so that anything which aggregates
# across repositories — a backlog roll-up, a cross-project report, a task id —
# has something durable to key on that is not a path, not a directory name, and
# not the framework's own version.
#
# WHAT THIS IS NOT: framework configuration. `architecture.conf` describes the
# HARNESS (its version, its counts, its feature flags) and is the same in every
# clone until upstream changes it. This file describes YOUR PROJECT and is
# stamped once, per clone, at `/initialize-project`. Keeping the two apart is
# the point: an upstream bump must never touch your identity, and your identity
# must never be a merge conflict against upstream.
#
# NOTHING HERE IS ENFORCED. No hook reads this file. No command requires it. A
# project that never stamps it works exactly as before — the validator says so
# and exits 0. The one thing the harness provides is the reader/validator, which
# is read-only and never writes, never deploys, and never runs git:
#
#   ./.logic-loom/scripts/bash/validate-project-identity.sh
#
# Override precedence: env LOOM_PROJECT_CONF > this file > nothing declared.
#
# ─────────────────────────────────────────────────────────────────────────────
# GRAMMAR
# ─────────────────────────────────────────────────────────────────────────────
# `key = value`, one per line, `#` starts a comment — the same grammar as the
# sibling configs (environments.conf, governance.conf, models.conf). Whitespace
# around `=` is ignored. This file is NEVER sourced or evaluated; it is parsed
# as text.
#
# Unlike environments.conf there is no block opener: a project has exactly ONE
# identity, so every key is top-level and each may appear at most once.
#
#   project_slug = <token>   REQUIRED. The machine key. IMMUTABLE ONCE SET —
#                            everything that references this project across
#                            repositories references this string, so changing it
#                            orphans that history. Pick it once, deliberately.
#                            Allowed: [a-z0-9][a-z0-9-]*  (lowercase kebab)
#
#   project_name = <text>    REQUIRED. The human display name. Free text. Change
#                            it whenever you like — nothing keys on it.
#
#   id_prefix    = <TOKEN>   REQUIRED. The short prefix used to MINT task ids
#                            that stay unambiguous when two projects' backlogs
#                            sit side by side (e.g. `ACME-014`). Uppercase,
#                            2-6 characters. Allowed: [A-Z][A-Z0-9]{1,5}
#                            Plan task ids inside `features/<x>/plan.md` stay
#                            project-local and short (`t1`, `t2`); this prefix is
#                            what qualifies them when they leave the repo.
#                            IMMUTABLE ONCE THE FIRST ID IS MINTED — same rule as
#                            project_slug, for a sharper reason. Nothing rewrites
#                            already-minted ids, so changing this strands every
#                            existing id in `.logic-loom/memory/todos.md` and
#                            `.logic-loom/memory/backlog.md` -- one shared id
#                            space across both -- and breaks every `blocked_on`
#                            reference that names one.
#                            Not enforced: no hook reads this file. Pick it before
#                            the first item, then never touch it.
#
#   repo         = <ref>     OPTIONAL. A human-readable pointer to where this
#                            project lives, e.g. `acme/widgets`. Free text.
#                            See the note below before you fill it in.
#
# Unknown keys are WARNED about and ignored — never fatal, matching
# environments.conf. Structural problems — a missing required key, a duplicate
# key, a malformed slug or prefix — are ERRORS.
#
# ─────────────────────────────────────────────────────────────────────────────
# ON `repo` — WHY IT IS OPTIONAL AND SHIPPED COMMENTED OUT
# ─────────────────────────────────────────────────────────────────────────────
# FOR including it: a slug identifies a project but does not LOCATE it. An
# aggregator that has collected backlog rows from six repos can render a link
# back to the source only if something in the row says where the source is.
#
# AGAINST including it: it is the one field here that is already discoverable —
# `git remote get-url origin` knows it — and it is the one field that CHANGES
# without anyone intending it to (a fork, a rename, a transfer, an org move,
# ssh-vs-https). A declared value that silently disagrees with the actual remote
# is worse than no value, and this validator cannot check it: it is read-only and
# runs no git, by construction.
#
# RESOLUTION: optional, free text, shipped commented out. The slug is the key and
# is authoritative; `repo` is a convenience label for a human or an aggregator
# that has no other way to reach back. Fill it in only if something you actually
# run needs it, and treat the git remote — not this line — as the truth.
#
# ─────────────────────────────────────────────────────────────────────────────
# SHIPPED UNSTAMPED — ON PURPOSE
# ─────────────────────────────────────────────────────────────────────────────
# The three required keys below carry the literal placeholder `__UNSET__`.
#
# Why not ship a real-looking default: a cloner must never inherit `logicloom` —
# or any other plausible-looking slug — as their project's identity. A default
# that looks real is a default that never gets changed, and the entire value of
# this file is that the slug is unique per project. `__UNSET__` cannot be
# mistaken for a considered choice.
#
# An unstamped file is a NORMAL state — a fresh clone that has not yet run
# `/initialize-project` has not decided anything yet. The validator reports it as
# a WARNING and exits 0.
#
# `/initialize-project` stamps these. To stamp by hand, replace the three
# `__UNSET__` values below.
# HARNESS-DEV NOTE (removed at promote by the same rule block that resets the
# three keys): this tree is BOTH the harness AND the template source, so the keys
# below are STAMPED here on dev-main — LogicLoom is a real project with a real
# backlog — and RESET to `__UNSET__` in the promoted template by
# history-scrub-rules.json. Same ours-in-dev / reset-at-promote pattern VISION.md
# uses. Do NOT hand them back to `__UNSET__` here: that kills the scrub rule, and
# tests/contract/test_scrub_rules_match.sh fails a rule that matches nothing.
# `id_prefix = LOOM` is NOT a free choice — backlog ids are already minted with
# it, and the prefix is immutable once the first id is minted.
#
# ─────────────────────────────────────────────────────────────────────────────
# YOUR PROJECT IDENTITY
# ─────────────────────────────────────────────────────────────────────────────

project_slug = logicloom
project_name = LogicLoom
id_prefix    = LOOM

repo         = kelleysd-apps/LogicLoom
