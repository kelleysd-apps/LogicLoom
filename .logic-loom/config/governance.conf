# LogicLoom governance configuration
#
# Governance enforcement is hook-side and model-independent (git-safety gate,
# dangerous-command guard, freeze-scope). These run regardless of the mode below.
#
# `mode` controls only the optional MODEL-SIDE assist injected on each message:
#
#   lean   (default) — hooks enforce; NO per-message compliance recitation.
#                      Correct for flagship Opus-class models, which follow the
#                      governance section of CLAUDE.md without prompting.
#
#   strict           — hooks enforce AND the 4-step compliance pre-flight is
#                      re-injected on every message. Use for weaker or
#                      non-flagship models (older Anthropic tiers) that benefit
#                      from the explicit assist. This is the graceful-degradation
#                      path for the harness across model capability.
#
# Override precedence: env LOOM_GOVERNANCE_MODE > this file > built-in default.

mode = lean

# ─────────────────────────────────────────────────────────────────────────────
# protected_paths — EXTEND the governance-file guard (ADDITIVE ONLY)
# ─────────────────────────────────────────────────────────────────────────────
# The governance-file guard (protect-governance-files.sh -> loom_path_is_protected)
# denies a subagent, and asks the user, before anything edits the files that
# enforce governance. Its built-in set is a FIXED FLOOR: the hooks directory,
# settings.json, the constitution, the verdict library, this file, and the
# loom-governance plugin hooks.
#
# THE FLOOR CANNOT BE REMOVED HERE. This key only ADDS. There is no syntax to
# delete, replace, or narrow a built-in entry — not an empty value, not a
# re-declaration, not a negation. That is deliberate: this file is itself on the
# protected list, so a key that could REPLACE the list would let a fork (or an
# agent) unprotect this file and then everything else. Adding too much is loud
# and reversible; removing something would be silent, so it is not offered.
#
# Use it when a fork renames or relocates governance-bearing files — e.g. a fork
# that uses `.specify/` instead of `.logic-loom/`, or keeps its hooks elsewhere.
# (Note: a renamed framework directory already protects its own `lib/`,
# `config/governance.conf`, and `memory/constitution.md` automatically — those are
# derived from the verdict library's own location. This key is for the rest.)
#
# Syntax — one path per line; repeat the key to add more:
#
#   protected_paths = .specify/hooks
#   protected_paths = tools/policy/*
#   protected_paths = ops/compliance/rules.yaml
#
# Rules:
#   - Paths are LITERAL and relative to the repo root.
#   - An entry protects that path AND everything beneath it. A trailing `/*` is
#     accepted and means the same thing (`dir` == `dir/*`) — it is spelling, not
#     a glob.
#   - No other pattern syntax. Entries containing `*`, `?`, `[`, `]`, or `\`
#     (beyond the optional trailing `/*`), absolute paths, `~`, or `..` segments
#     are IGNORED — a literal cannot be crafted to match less than it looks like.
#   - Malformed entries are skipped individually; a malformed or missing file
#     never reduces protection, it just adds nothing.
#   - `#` starts a comment.
#
# Unlike `mode` (first occurrence wins), every occurrence of this key is unioned.
#
# No additions by default:
# These two govern behaviour, so they carry the same protection as
# gate-policy.conf: a subagent must not be able to rewrite the policy and then
# act under it. memory-backend.conf decides WHERE /retro and memory search read
# and write; brain.conf tunes the distillation advisories.
protected_paths = .logic-loom/config/memory-backend.conf
protected_paths = .logic-loom/config/brain.conf
