# LogicLoom gate policy — which operations INTERRUPT you, and which just run
#
# This file is LIVE. Unlike environments.conf (a worked example), every line
# below is the running policy. Change a value, save, and the next git/gh command
# is judged by the new value — no restart, no shell to edit.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS
# ─────────────────────────────────────────────────────────────────────────────
# Governance used to answer one question: "does this command change the repo?"
# If yes, it asked. So `git commit -m "wip"` and `git push --force` produced
# exactly the same prompt — and a prompt you see fifty times a day is a prompt
# you stop reading. That is not safety, it is habituation.
#
# There are really TWO questions:
#   1. Does this change the repository?          (answered in the verdict library)
#   2. Is that change worth interrupting you?    (answered HERE, by you)
#
# Separating them is what lets the loud gate stay loud.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE TWO VERDICTS
# ─────────────────────────────────────────────────────────────────────────────
#   ask     — Claude Code shows an approval prompt before the command runs.
#   silent  — the command runs without a prompt. It is still logged, still
#             visible in the transcript, and still subject to your permission
#             mode; "silent" means "no extra prompt from LogicLoom", NOT
#             "unsupervised".
#
# Syntax is the same `key = value` grammar as the sibling config files:
#
#     git.push = ask
#     git.commit = silent
#
# One operation per line. `#` starts a comment. First occurrence of a key wins.
# There is deliberately NO wildcard, no `*`, and no "silence everything" line:
# weakening the gate should cost as many lines as the number of things you are
# weakening.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE FLOOR — five operations you cannot turn off
# ─────────────────────────────────────────────────────────────────────────────
# Marked [FLOOR] below. Setting one of them to `silent` is REFUSED, not
# ignored: the line stays `ask` and the refusal is reported with a typed reason
# (run `/initialize-project`, or call `loom_gate_policy_refusals` from the
# verdict library, to see them). This is the same shape as the protected-path
# list, which has no syntax for removing an entry.
#
# The test for floor membership is one sentence: a wrong answer leaves the
# repository, or a credential, somewhere a revert cannot reach.
#
# Two more floors are not listed here at all, because they are not policy:
#   - Governance-file writes (hooks, settings.json, the constitution, the verdict
#     library, this file) — subagent DENY, main-agent ASK, always.
#   - Subagent git/gh — a subagent keeps allowlisted read-only git, and is denied
#     every git mutation and all of gh, in every posture and every mode.
#
# ─────────────────────────────────────────────────────────────────────────────
# IF THIS FILE IS MISSING, UNREADABLE, OR CORRUPT
# ─────────────────────────────────────────────────────────────────────────────
# The built-in defaults apply — the same values written below. It never falls
# back to "allow everything". A line with an unrecognized key does nothing; a
# line with an unrecognized value falls back to that operation's default.
# Deleting this file entirely is safe and changes nothing.
#
# ─────────────────────────────────────────────────────────────────────────────
# POSTURES
# ─────────────────────────────────────────────────────────────────────────────
# `/initialize-project` (and init-project.sh) offer three presets. What you have
# below is `balanced`, the shipped default.
#
#   strict    — every operation asks. Nothing is silent.
#   balanced  — consequential and destructive operations ask; routine local work
#               runs silently. (SHIPPED DEFAULT)
#   minimal   — everything tunable is silent; only the five [FLOOR] operations ask.
#
# Re-running the onboarding rewrites the operation lines below and leaves this
# commentary intact.
#
# ═════════════════════════════════════════════════════════════════════════════
# GIT
# ═════════════════════════════════════════════════════════════════════════════

# --- Publishing and history ---------------------------------------------------

# Sends commits to a remote. Cannot be un-published — someone else may have
# pulled it before you noticed. This is Principle VI's canonical case.
git.push = ask                    # [FLOOR]

# `filter-branch`, `fast-import`, `update-ref`, and the writing form of
# `symbolic-ref`. Rewrites or repoints history directly; the old objects become
# unreachable and are eventually garbage-collected.
git.history-rewrite = ask         # [FLOOR]

# --- Operations that bring in, or reshape, other people's work ---------------

# Fetches AND merges. Can produce conflicts and rewrite your working tree.
git.pull = ask

# Combines branches. Recoverable, but it changes what "my branch" means.
git.merge = ask

# Rewrites your commits onto a new base. Recoverable via reflog, but only if you
# know to look there.
git.rebase = ask

# --- Operations that destroy uncommitted work ---------------------------------
#
# NOTE — DELIBERATE DEVIATION. The next four sit in `ask` even though a
# reasonable reading of "routine local work" would put them in `silent`. They
# are the only operations here that destroy work which was never committed, and
# therefore the only ones with NO undo: not reflog, not `git revert`, nothing.
# Everything else in the `ask` list is recoverable with enough effort. These are
# not. If you move them to `silent`, you are accepting that an agent can
# discard your uncommitted edits without telling you first.

# Discards all uncommitted changes and moves HEAD.
git.reset.hard = ask

# `git clean` — deletes untracked files outright. Not even in the object store.
git.clean = ask

# `git restore`, and any `git checkout` form that could touch working-tree files
# (a `--` pathspec, `-p/--patch`, more than one operand, or a single operand that
# is not unambiguously a branch name). Overwrites file contents in place.
# See the note under git.checkout about the conservative reading.
git.restore = ask

# Non-hard `git reset` (mixed/soft/keep). Unstages or moves HEAD. Less
# destructive than --hard, but still surprising if you did not ask for it.
git.reset = ask

# --- Operations that restructure the repository -------------------------------

# Deletes stashed work permanently (`git stash drop`, `git stash clear`).
# Split out from git.stash for the same reason as the group above: no undo.
git.stash.drop = ask

# Removes tracked files from the index and the working tree.
git.rm = ask

# Renames/moves tracked files. Cheap to undo, but it moves things out from under
# whatever else is running.
git.mv = ask

# Creating, deleting, renaming, or re-pointing a branch — including `git checkout
# -b` and `git switch -c`. Branch topology is shared context; a silently created
# or deleted branch is a confusing branch.
git.branch.write = ask

# `git worktree add/remove/move/prune/lock/unlock/repair`. An agent that can add
# a worktree can stage work outside the tree you are watching, and `remove` can
# discard uncommitted work in it.
git.worktree.write = ask

# `git remote add/remove/rename/set-url`. Changes WHERE your code gets pushed —
# the one setting that turns a safe `git push` into an exfiltration.
git.remote.write = ask

# --- Routine local work: runs without a prompt --------------------------------

# Records a commit. Local, fully revertible, and the single most common
# operation there is. Prompting for it is what trained people to stop reading
# prompts.
git.commit = silent

# Stages changes. Touches only the index.
git.add = silent

# `git stash` / `stash push` / `stash list` / `stash show` / `stash pop` /
# `stash apply`. Saves work rather than destroying it. (Destroying it is
# git.stash.drop, above.)
git.stash = silent

# Creates or deletes a LOCAL tag. Publishing a tag is a push, which asks.
git.tag.write = silent

# Moving between existing branches or refs: `git checkout <branch>`,
# `git switch <branch>`, `git checkout -`.
#
# CONSERVATIVE READING: `git checkout src/a.ts` discards that file, and nothing
# in the command text distinguishes it from a ref of the same name. So any
# checkout with a `--`, a `-p`, more than one operand, or an operand containing
# `/` or `.` is classified as git.restore (ask) instead. That means
# `git checkout origin/main` asks. If you find that noisy, move git.restore to
# silent — and re-read the deviation note above first. `git switch` has no
# pathspec form at all, so it is never reclassified.
git.checkout = silent

# Applies an existing commit onto the current branch. Additive; revertible.
git.cherry-pick = silent

# Creates a new commit that undoes an old one. Additive by construction.
git.revert = silent

# Applies a mailbox of patches as commits.
git.am = silent

# Applies a patch to the working tree.
git.apply = silent

# Downloads remote objects and updates remote-tracking refs. Touches no local
# branch and no working-tree file.
# (Note: a SUBAGENT still may not run fetch — that is the subagent floor, which
# this file does not control.)
git.fetch = silent

# ═════════════════════════════════════════════════════════════════════════════
# GITHUB CLI (gh)
# ═════════════════════════════════════════════════════════════════════════════
# `gh` mutates the repository just as surely as `git` does — it just does it
# server-side, where a local revert cannot reach.

# Destroys, archives, or reconfigures the repository itself.
gh.repo.admin = ask               # [FLOOR]

# `gh secret set`, `gh variable set`, `gh ssh-key add`. Writes credentials into
# CI, where they are then usable by anything that runs there.
gh.secret.write = ask             # [FLOOR]

# `gh auth login` / `gh auth refresh`. Changes which identity every subsequent
# gh command acts as.
gh.auth = ask                     # [FLOOR]

# Opens a pull request — the moment work becomes visible to other people.
gh.pr.create = ask

# Merges a pull request, usually into a protected branch.
gh.pr.merge = ask

# `gh pr close/reopen/review/edit`. Changes a PR's state or leaves a review
# under your name.
gh.pr.edit = ask

# `gh workflow run/enable/disable`. Dispatches or silences CI — including
# release workflows.
gh.workflow.write = ask

# `gh release create/delete/edit`. A published release is the definition of
# something a revert cannot take back.
gh.release.write = ask

# `gh api` with POST/PUT/PATCH/DELETE (or field flags, which imply POST). This is
# the laundering path: `gh api -X PUT repos/o/r/pulls/9/merge` merges a PR
# without the word "merge" appearing as a gh verb.
gh.api.write = ask

# `gh alias set`. Defines a shorthand that later expands to anything at all.
gh.alias.set = ask

# Deletes an issue outright (as opposed to closing it).
gh.issue.delete = ask

# `gh issue create/close/edit/pin`. Issue traffic is cheap, visible, and
# reversible; prompting for it is friction without a payoff.
gh.issue.write = silent

# `gh run rerun/cancel`. Re-runs or stops a CI run that already exists — it
# dispatches nothing new. (Dispatching is gh.workflow.write, above.)
gh.run.write = silent

# ═════════════════════════════════════════════════════════════════════════════
# PERMISSION-MODE AWARENESS
# ═════════════════════════════════════════════════════════════════════════════
# Claude Code tells each hook which permission mode the session is in
# (`permission_mode` in the PreToolUse payload — observed in real payloads).
# Two values matter here:
#
#   enforce — use the policy above exactly as written.
#             SHIPPED DEFAULT for every mode, bypassPermissions included.
#   relax   — every TUNABLE operation becomes silent. The five [FLOOR]
#             operations still ask. Subagent rules are untouched.
#
# WHAT `relax` IS FOR, AND WHY SOMEONE WOULD WANT IT
# Under a permission mode that approves everything anyway (bypassPermissions),
# a LogicLoom `ask` may well be redundant: the host is understood to fold a hook
# `ask` back into its own permission pipeline, where the mode then auto-approves
# it. If that is how your host behaves, `relax` removes a prompt that was never
# going to reach you, and the noise it causes buys nothing.
#
# WHY IT IS NOT THE SHIPPED DEFAULT
# That redundancy is INFERRED from host behaviour — it is NOT something we have
# verified. And the tunable set includes operations with no undo: git.clean,
# git.reset.hard, git.restore, git.rm, and the branch/worktree/remote writes.
# Defaulting to `relax` would wager uncommitted work on an unverified claim, so
# the shipped default errs toward asking. A redundant prompt costs a keystroke;
# a wrong silence costs the work.
#
# FLIPPING IT IS A SUPPORTED CHOICE
# Uncomment `mode.bypassPermissions = relax` at the bottom of this file and the
# relaxed behaviour takes effect on the next command. The mechanism is fully
# wired and pinned by the contract tests — it is a deliberate one-line decision,
# just not one made on your behalf.
#
# `dontAsk` should stay `enforce` for an independent reason: there, an `ask`
# becomes a DENY. That is the safe direction, and quietly converting it to
# `allow` would be the harness overriding a mode you chose specifically to be
# restrictive. `auto` likewise: auto mode hands the decision to a classifier,
# which is a judgement — and a hook `ask` is exactly the signal that raises this
# call to the classifier's attention rather than sliding past it.
#
# Uncomment and change any of these if your habits differ.
#
# mode.default = enforce
# mode.acceptEdits = enforce
# mode.plan = enforce
# mode.auto = enforce
# mode.dontAsk = enforce
# mode.bypassPermissions = enforce   # set to `relax` to silence tunable gates
