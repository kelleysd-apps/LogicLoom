# LogicLoom model configuration (role -> tier)
#
# Documented convention (Constitution Principle XIV). Agents/commands select
# tiers via frontmatter keywords (opus/sonnet/haiku/inherit); this file records
# the role->tier mapping and current flagship. No runtime resolver consumes it
# yet — it is a reference table, not a parsed config.
#
# MODEL & PROVIDER BOUNDARY: the orchestration runtime is Claude-Code-native and
# runs Anthropic models only. Cross-provider models (OpenAI/Gemini/Mistral) are
# supported solely at the delegated research / verification layer — never for
# orchestration. Two consumers today:
#   - /research        : spawns researchers/judges that call OpenAI/Gemini APIs.
#   - /cross-check     : the governed cross-provider adversarial reviewer (also
#                        wired into /review-team and /plan-review). The external
#                        model is held strictly ADVISORY + READ-ONLY — it emits
#                        findings; the governed Claude agent triages and decides.
# In all cases the external model never writes repo source, runs git, or makes a
# control-flow decision. The instant it would, it has crossed into orchestration
# and violated this boundary (and Principle VI).
#
# PORTABILITY (superseded stance): this Claude-Code-native runtime is the
# REFERENCE host. The POLICY layer (constitution + AGENTS.md Tier 1 + the
# Cross-Check Disposition) is provider-neutral and travels to any host as
# model-followed rules; ENFORCEMENT (the hooks) does not travel — see the
# enforced-vs-followed matrix in .docs/architecture/governance-threat-model.md.
# NEUTRAL READING of the tier keywords on a non-Claude host: opus -> your
# most-capable reasoning model; sonnet -> a balanced model; haiku -> a
# cheaper/faster model.

# Current Anthropic flagship (for reference; agents use the tier keyword "opus")
FLAGSHIP_MODEL = claude-opus-4-8

# Frontier tier — the ORCHESTRATOR's preferred class. Model-AGNOSTIC by design
# (any frontier-class Anthropic model), pinned to a concrete default with a
# documented fallback so the role survives a quota/availability gap. Both targets
# are Anthropic (Opus-class or above): the orchestrator NEVER runs on a
# non-Claude model — that would cross the provider boundary above and Principle VI.
FRONTIER_MODEL    = claude-fable-5    # default orchestrator model
FRONTIER_FALLBACK = claude-opus-4-8   # downgrade target when Fable 5 is unavailable / out of quota

# Role -> tier. Tiers resolve to the current model in each class at runtime.
LOOM_MODEL_ORCHESTRATOR = frontier  # main-session planner/delegator (Fable 5 -> Opus 4.8 fallback); reasons/plans/delegates, does NOT do bulk execution
LOOM_MODEL_DEFAULT   = opus     # general specialized work
LOOM_MODEL_ARCHITECT = opus     # planning, architecture, complex reasoning
LOOM_MODEL_WORKER    = opus     # swarm/team implementors (set to sonnet for cost)
LOOM_MODEL_REVIEWER  = opus     # review-team, plan-review, evaluators
LOOM_MODEL_MEMORY    = haiku    # memory context injection, quick lookups
LOOM_MODEL_QUICK     = haiku    # formatting, file ops, trivial tasks

# Model IDs by tier (update when a new flagship ships)
#   frontier -> claude-fable-5   (fallback: claude-opus-4-8)   # orchestrator tier
#   opus     -> claude-opus-4-8
#   sonnet   -> claude-sonnet-5
#   haiku    -> claude-haiku-4-5-20251001                      # NOTE: no `effort` support
#
# EFFORT: `effort` (low|medium|high|xhigh|max) is supported on frontier/opus/
# sonnet tiers only — NOT haiku (pin a worker to haiku only if it needs no effort
# control). Claude Code supports STATIC frontmatter `effort:` on agents; DYNAMIC
# per-dispatch effort is available at the /workflow layer (agent() effort option),
# not on raw Task-spawned subagents.
#
# ORCHESTRATOR + WORKER LADDER (see .docs/architecture/orchestrator-worker-ladder.md):
#   orchestrator  = frontier  (Fable 5 / Opus 4.8)  — plan, reason, delegate
#   deep-reasoner = opus       (.claude/agents/deep-reasoner.md, effort high)
#   fast-worker   = sonnet     (.claude/agents/fast-worker.md, effort medium)
# Non-Claude models stay ADVISORY-only (/research, /cross-check) — never workers.

# ============================================================================
# Advisory cross-provider models (verification layer only — /research + /cross-check)
# ============================================================================
# BOUNDARY (see the MODEL & PROVIDER BOUNDARY block at the top of this file):
# these cross-provider models are ADVISORY + READ-ONLY. They live at the
# delegated verification layer only — /research and /cross-check. They NEVER
# orchestrate, NEVER write repo source, and NEVER run git (Principle VI). They
# emit findings; the governed Claude agent triages and decides.
#
# This block is the SINGLE documented source for which non-Claude model each
# provider defaults to. Both consumers (/research and /cross-check) resolve the
# same way and share the same override variables.
#
# Documented defaults (used when the matching override var is unset):
#   OpenAI  ->  gpt-5.5                  # current flagship; undated alias
#   Gemini  ->  gemini-3.1-pro-preview   # current most-capable reasoning; undated rolling preview alias
#
# Shared override variables (read by BOTH /research and /cross-check):
#   CROSS_CHECK_OPENAI_MODEL   # overrides the OpenAI advisory model
#   CROSS_CHECK_GEMINI_MODEL   # overrides the Gemini advisory model
#
# Resolution order (per provider):
#   1. (/research only) a per-run flag: --openai-model / --gemini-model / --claude-model
#   2. the override env var (CROSS_CHECK_OPENAI_MODEL / CROSS_CHECK_GEMINI_MODEL)
#   3. else the documented default above (gpt-5.5 / gemini-3.1-pro-preview)
#
# Bumping a provider's advisory model = edit the default above, set the env var,
# or (per run) pass the /research flag. Nothing parses this file; it is the
# documented reference — the override vars / flags are the runtime knob.
#
# ----------------------------------------------------------------------------
# GROUNDING RULE (fail closed on fast-moving external interfaces)
# ----------------------------------------------------------------------------
# The model names, endpoints, and parameters above are the fastest-drifting
# facts in this repo: they change on the provider's release schedule, not ours,
# and nothing here validates them.
#
#   When a fast-moving external API, model name, endpoint, or parameter is
#   involved, VERIFY against live provider documentation. Do not answer from
#   parametric knowledge. If verification is not possible in the moment, FAIL
#   CLOSED — say you are unsure and name what you could not confirm. Never
#   assert a stale detail as current.
#
# Applies to anything on the far side of the provider boundary: the defaults
# above, the `/research` and `/cross-check` endpoints and request shapes, and
# any provider capability claim (context window, effort support, pricing).
#
# This STRENGTHENS the advisory-only boundary rather than crossing it: it
# constrains what the GOVERNED CLAUDE AGENT is entitled to assert about an
# external provider. It grants the external model nothing, and it is a rule, not
# a mechanism — no verification checker is built or wanted here. The moment it
# grows a runtime checker it has become the overreach the boundary forbids.
