# LogicLoom brain layer — advisory thresholds for the distillation routine
#
# This file is LIVE, and it tunes exactly one thing: when the two ADVISORY
# signals about `.brain/` speak up. It has no effect on the CI gate
# (check-brain-record.sh), which is fail-closed and not tunable, and no effect
# on what /distill does.
#
# ─────────────────────────────────────────────────────────────────────────────
# THREE SIGNALS, THREE DELIBERATELY DIFFERENT TREATMENTS
# ─────────────────────────────────────────────────────────────────────────────
#   RECORD INTEGRITY  "does the routine's own record hold together?"
#                     -> check-brain-record.sh, CI, FAIL-CLOSED. Not keyed here.
#                        A broken record is caused by the change in front of it.
#
#   LIVENESS          "did the pass run recently?"       -> advisory, never blocks
#   LOAD              "is there a backlog?"              -> advisory, never blocks
#
# Why only the first is a gate: a fail-closed gate must assert something the
# change in front of it can be responsible for. "The log says run 2026-09-04
# promoted capture X into page Y, and page Y does not exist" is deterministic
# and is never a false alarm on an unrelated PR. "You have not distilled in 40
# days" is not caused by the PR it would block — gating on it blocks unrelated
# work, and the trained response is to bypass. A cloner who never adopts the
# routine would inherit a permanently red build, which is the fastest possible
# route to the gate being deleted.
#
# ─────────────────────────────────────────────────────────────────────────────
# QUEUE DEPTH IS A LOAD SIGNAL, NOT A HEALTH SIGNAL
# ─────────────────────────────────────────────────────────────────────────────
# Depth cannot answer "did the pass run?", because the two states that matter
# read identically: a pass that ran and cleared the queue, and a pass nobody
# ever installed over a repo where nobody captured anything, BOTH read zero.
# That is not hypothetical — in the system this routine was ported from, depth
# read zero on eight of its last ten runs.
#
# Liveness is therefore measured as the AGE OF THE NEWEST ENTRY in
# `.brain/DISTILL-LOG.md`, which is exact, needs no knowledge of scheduling,
# and cannot be faked by an empty queue. That is why /distill logs EVERY run,
# including a zero-op one: a one-line healthy entry is what makes a later break
# visible by contrast.
#
# ─────────────────────────────────────────────────────────────────────────────
# SILENCE RULES (not tunable — they are what keep the advisory worth reading)
# ─────────────────────────────────────────────────────────────────────────────
#   - Silent when there are NO unprocessed captures AND no DISTILL-LOG.md.
#     An unadopted routine must make no noise. Same structural-silence
#     discipline check-dev-branch-base.sh uses to stay quiet in a clone.
#   - The liveness warning requires BOTH an old log AND at least one unprocessed
#     capture. The conjunction is the whole point: a quiet month over an empty
#     queue is not a fault, and warning about it is exactly the nagging that
#     gets an advisory tuned out.
#   - Once per session per state, not once per prompt.
#
# ─────────────────────────────────────────────────────────────────────────────
# SYNTAX
# ─────────────────────────────────────────────────────────────────────────────
# Same `key = value` grammar as the sibling config files. `#` starts a comment.
# First occurrence of a key wins. Values are whole numbers of items or days.
# A missing, malformed or out-of-range value falls back to the default below
# and is otherwise ignored — an advisory must never fail a shell.
#
# Set `advisory_enabled = false` to silence both signals entirely. It does not
# touch the CI gate.

advisory_enabled = true

# LOAD — warn when the number of `status: unprocessed` captures under
# `.brain/raw/` exceeds this. Calibrated against this repo's real rate
# (~13 instance documents in ~3 months, arriving in bursts): five is more than
# one burst.
#
# NOTE this counts UNPROCESSED CAPTURES, never "files in raw/". The two numbers
# diverge permanently here, because this port does NOT delete a capture after
# distilling it (the capture is evidence, and it is the only surviving copy on
# the public line once the dev line's history is out of reach).
load_max_unprocessed = 5

# LOAD — warn when the oldest unprocessed capture is older than this many days.
# Three capture cycles.
#
# Age is measured from the capture's frontmatter `date:` when it has one, and
# from file mtime otherwise. mtime is a proxy and it resets on a fresh checkout;
# that is acceptable for an advisory and is stated rather than hidden.
load_max_age_days = 21

# LIVENESS — warn when the newest `.brain/DISTILL-LOG.md` entry is older than
# this many days AND at least one unprocessed capture exists.
liveness_max_age_days = 30
