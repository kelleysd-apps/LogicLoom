# kind | name | fate | replacement | default | first_shipped | release | note
#
# Line-oriented. '#' comments and blank lines are ignored. Every other line
# MUST have exactly 8 pipe-separated fields; whitespace around each field is
# trimmed. A raw '|' is the field separator. To put a literal '|' INSIDE a
# field (e.g. a POSIX ERE alternation in a `pattern:` replacement), escape it
# as the two-character sequence '\|' — the parser decodes '\|' to a literal
# '|' after splitting, so a raw '|' still means "new field" and only the
# escaped form survives inside a field.
#
# kind        plugin | mcp-server | path | content | none
# fate        plugin/mcp-server/path: renamed | folded | native | removed
#             content: present | absent
#             none: exactly 'none'
# replacement 'none', or prefixed plugin: | path: | command: | native: |
#             external: | pattern: — 'pattern:' is valid ONLY on content rows
#             (POSIX ERE; may contain \| for alternation) and content rows
#             MUST use it
# default     REMOVE | ADOPT-REPLACEMENT | CONVERT-TO-LOCAL | KEEP-AS-IS |
#             MOVE | PROPOSE | PROPOSE-ADVISORY | -   (content rows: PROPOSE
#             or PROPOSE-ADVISORY; none rows: -)
#             PROPOSE-ADVISORY (the KORI CLASS): a content row whose target
#             LogicLoom never shipped — a fork's own file that has since gone
#             stale relative to a convention LogicLoom now documents. MAY
#             target only amendments.md | CLAUDE.md | CLAUDE.local.md |
#             AGENTS.md (basename), fires in BOTH TEMPLATE and ADOPTED modes
#             (never scoped by the adopt receipt — the harness never wrote
#             this file), is proposal-only exactly like PROPOSE (the script
#             never writes a file for any content row), and its output always
#             states plainly that LogicLoom did not ship this text.
# first_shipped  vX.Y.Z | never | -
# release     always vX.Y.Z — the first shipped tag that lacks it
#             (deprecation rows), or the release the row belongs to
#             (content/none rows)
# note        free text; a content row's note MUST contain both 'proposal:'
#             and 'why:'; a none row's note says why nothing adopter-facing
#             changed. A content row MAY also carry 'fixture:<name>' — the
#             gate this release ships (`release-migrations.sh check-release`)
#             proves every content row of the release it checks by finding a
#             copy that exhibits the row's claimed PRIOR (unfixed) state and a
#             copy that exhibits its claimed FIXED state. For a row whose
#             target LogicLoom itself ships and edits, that proof comes from
#             git history (the previous release's tag, and the current tree's
#             own shipped copy) with no note change needed. For a row whose
#             target LogicLoom never shipped (the receipt file below;
#             PROPOSE-ADVISORY rows always, since a fork's file has no
#             LogicLoom-authored prior copy at any tag), 'fixture:<name>'
#             names tests/fixtures/release-migrations/<name>.before and
#             .after — ship-safe (tests/ never reaches an ADOPTED install)
#             and read ONLY by check-release, never by scan/plan/convert.
#
# A name may appear once among deprecation rows (plugin/mcp-server/path).
# Content rows MAY share a name — identity there is (name, release, pattern).
# A none row must be the ONLY row naming its release.

